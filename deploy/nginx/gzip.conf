# Cut egress for text/XML/JSON (sitemaps compress ~80%+)
# Install: sudo cp deploy/nginx/gzip.conf /etc/nginx/conf.d/gzip.conf && sudo nginx -t && sudo systemctl reload nginx
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/xhtml+xml
    image/svg+xml
    application/manifest+json
    font/woff
    font/woff2
    application/font-woff
    application/font-woff2;
