# Static brand assets — serve from disk with long cache (cuts AWS Data Transfer).
# Paste BEFORE `location /` in each public HTTPS (and HTTP) server block.

# Tiny favicon — ignore query strings (?w=32 from MSN etc.)
location = /favicon.ico {
    alias /home/ec2-user/ContentVersa/build/public/favicon.ico;
    default_type image/x-icon;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

location = /favicon.svg {
    alias /home/ec2-user/ContentVersa/build/public/favicon.svg;
    default_type image/svg+xml;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location = /apple-touch-icon.png {
    alias /home/ec2-user/ContentVersa/build/public/apple-touch-icon.png;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ~* ^/favicon-(16x16|32x32|48x48)\.png$ {
    root /home/ec2-user/ContentVersa/build/public;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ~* ^/icon-(192|512)\.png$ {
    root /home/ec2-user/ContentVersa/build/public;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Hashed Next static assets — long cache at the edge of origin
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Sitemap: short cache so crawlers do not re-pull full XML every hit
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /news-sitemap.xml {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
}
