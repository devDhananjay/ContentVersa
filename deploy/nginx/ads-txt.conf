# Serve ads.txt from disk (bypass Next.js / rate limits).
# Include inside both HTTP and HTTPS server blocks, BEFORE location /.
#
#   include /etc/nginx/snippets/contentverse-ads-txt.conf;
#
# Or paste the location block directly.

location = /ads.txt {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /home/ec2-user/ContentVersa/build/public/ads.txt;
}
