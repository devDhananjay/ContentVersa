# Include inside each public server { } (HTTPS) near the top.
# Never 403 ads.txt / robots.txt — AdSense + Google treat 40x as "Not found".
set $egress_block 0;
if ($egress_ip_blocked) {
    set $egress_block 1;
}
if ($egress_ua_blocked) {
    set $egress_block 1;
}
if ($request_uri ~* "^/(ads\.txt|app-ads\.txt|robots\.txt)(\?.*)?$") {
    set $egress_block 0;
}
if ($egress_block = 1) {
    return 403;
}
