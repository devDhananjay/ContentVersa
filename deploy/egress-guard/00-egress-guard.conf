# HTTP-context maps for egress protection (ContentVerse + Vidyora).
# Loaded from /etc/nginx/conf.d/ — keep filename 00- so it loads before site servers.

map $http_user_agent $egress_ua_blocked {
    default 0;
    # AI / scrapers that caused AWS data-transfer bill spikes. Keep Googlebot/Bingbot.
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|CCBot|ClaudeBot|anthropic-ai|Bytespider|Diffbot|DotBot) 1;
}

geo $egress_ip_blocked {
    default 0;
    include /etc/nginx/egress-guard/blocked-ips.geo;
}

# Soft request flood protection (shared by sites that include limit_req).
limit_req_zone $binary_remote_addr zone=egress_req:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=egress_conn:10m;
